<?php
// URL com parâmetro (neste exemplo, o número é 48991375142)
$url = 'https://evolution.hypeneural.com/instance/connect/vipsocial?number=48996318744';

// Sua apikey
$apikey = 'CAC5F5F7CBCB-4671-8A1F-A1A2C0E11680';

// Inicializa cURL
$ch = curl_init($url);

// Define cabeçalho com a apikey
curl_setopt($ch, CURLOPT_HTTPHEADER, [
    'apikey: ' . $apikey
]);

// Retornar a resposta em vez de imprimir
curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);

// Executa a requisição
$response = curl_exec($ch);
curl_close($ch);

// Decodifica JSON
$data = json_decode($response, true);
?>
